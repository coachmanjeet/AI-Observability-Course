<text x="26" y="333.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#000000">Each model call is a CLIENT span with the provider, the model and</text>
<text x="26" y="347.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#000000">the tokens it used.</text>
