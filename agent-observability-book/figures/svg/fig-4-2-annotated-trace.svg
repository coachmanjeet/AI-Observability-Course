<text x="4" y="268.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" font-style="italic" fill="#000000">Total 39.4 s. Gray bars are model calls; white bars are tool calls.</text>
