<text x="26" y="370.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#000000">Each tool call is its own span, carrying the tool-call ID the</text>
<text x="26" y="384.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#000000">model chose.</text>
<circle cx="11" cy="403" r="9.775" fill="#000000"/><text x="11" y="407.14" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="26" y="407.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#000000">One model response asked for two tools; both spans hang off the</text>
<text x="26" y="421.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#000000">same agent span.</text>
